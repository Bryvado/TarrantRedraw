<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tarrant Redraw — Commissioner Precincts</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="boot">
  <div class="boot-box">
    <h1>Tarrant Redraw</h1>
    <p id="boot-msg">Loading data…</p>
    <div class="boot-bar"><div id="boot-bar-fill"></div></div>
  </div>
</div>

<header id="topbar">
  <div class="brand">Tarrant&nbsp;Redraw</div>

  <label class="tb-field">Plan
    <input id="plan-name" type="text" spellcheck="false" autocomplete="off">
  </label>
  <div class="tb-group">
    <button id="btn-save" title="Save under the plan’s name, overwriting that saved plan (Ctrl+S)">Save</button>
  </div>
  <span id="save-state" class="save-state" aria-live="polite"></span>

  <div class="tb-group">
    <button id="btn-undo" title="Undo (Z or Ctrl+Z)">Undo</button>
    <button id="btn-redo" title="Redo (R or Ctrl+Shift+Z)">Redo</button>
    <button id="btn-clear" title="Unassign every VTD, drop all block splits and unlock every precinct. Undo restores it.">Clear</button>
  </div>

  <div class="tb-group">
    <button id="btn-plans" title="Saved plans">Plans…</button>
    <button id="btn-start" title="Start from a reference plan">Start from…</button>
  </div>

  <div class="tb-group">
    <button id="btn-export-block" class="primary" title="Block assignment CSV for Dave's Redistricting">Export blocks (DRA)</button>
    <button id="btn-export-menu">Export…</button>
    <button id="btn-import">Import…</button>
  </div>

  <div class="tb-spacer"></div>
  <div id="status" class="tb-status"></div>
</header>

<main id="shell">

  <aside id="tools">
    <section class="tool-sec">
      <h2>Precincts</h2>
      <div id="precinct-list"></div>
      <button id="btn-unassign" class="pick-unassigned">
        <span class="swatch swatch-none"></span>
        <span class="pk-name">Erase</span>
      </button>
    </section>

    <section class="tool-sec">
      <h2>Tool</h2>
      <div class="seg" id="brush-mode">
        <label title="Paint units with the active precinct"><input type="radio" name="brushmode" value="click" checked><span>Brush <kbd>B</kbd></span></label>
        <label title="Drag a box to paint everything inside it"><input type="radio" name="brushmode" value="box"><span>Box <kbd>M</kbd></span></label>
        <label title="Paint a whole connected region in one click"><input type="radio" name="brushmode" value="fill"><span>Fill <kbd>F</kbd></span></label>
        <label title="Click a unit to see its numbers and split or merge it, without painting"><input type="radio" name="brushmode" value="select"><span>Select <kbd>S</kbd></span></label>
        <label title="Drag to move the map"><input type="radio" name="brushmode" value="pan"><span>Pan <kbd>H</kbd></span></label>
      </div>
      <label class="sizerow">Size <kbd>[</kbd> <kbd>]</kbd>
        <input type="range" id="brush-size" min="1" max="5" step="1" value="1">
      </label>
      <div class="tworow">
        <label class="chk"><input type="checkbox" id="opt-only-unassigned"> Unassigned only <kbd>U</kbd></label>
        <button id="btn-keys" class="linkbtn">Keys <kbd>?</kbd></button>
      </div>
    </section>

    <section class="tool-sec">
      <h2>Shading</h2>
      <select id="shade-mode">
        <optgroup label="Plan">
          <option value="district" selected>Assigned precinct</option>
        </optgroup>
        <optgroup label="Partisan">
          <option value="dshare">Dem share, composite</option>
          <option value="share26">Dem share, 2026</option>
          <option value="dshare_pre">Dem share, 2020–24</option>
          <option value="shift26">2026 shift</option>
        </optgroup>
        <optgroup label="Demographics (VAP)">
          <option value="hisp">Hispanic VAP</option>
          <option value="black">Black VAP</option>
          <option value="nonwhite">Nonwhite VAP</option>
        </optgroup>
      </select>
      <div id="legend" class="legend"></div>
      <label class="sizerow" id="palette-row">Colors
        <select id="partisan-palette" title="Brown / teal and orange / purple are easier to tell apart with a color-vision deficiency"></select>
      </label>
      <div class="chkgrid">
        <label class="chk"><input type="checkbox" id="opt-agg"> Totals <kbd>T</kbd></label>
        <label class="chk" title="Fade the shading so the basemap reads through"><input type="checkbox" id="opt-opacity"> Dim</label>
        <label class="chk wide"><input type="checkbox" id="opt-unassigned" checked> Shade unassigned</label>
      </div>
    </section>

    <section class="tool-sec">
      <h2>Overlays</h2>
      <div class="chkgrid">
        <label class="chk"><input type="checkbox" id="ov-map7"> Map 7</label>
        <label class="chk"><input type="checkbox" id="ov-cities"> Cities</label>
        <label class="chk"><input type="checkbox" id="ov-comm"> Communities</label>
        <label class="chk"><input type="checkbox" id="ov-labels" checked> Labels</label>
      </div>
    </section>
  </aside>
  <div id="rz-tools" class="resizer resizer-x" title="Drag to resize · double-click to reset"></div>

  <div id="center">
    <div id="map-wrap">
      <div id="map"></div>
      <div id="box-rubber" hidden></div>
      <div id="brush-ring" hidden></div>
      <div id="unit-card" class="unit-card" hidden></div>
      <div id="map-note" class="map-note"></div>
    </div>

    <div id="rz-dock" class="resizer resizer-y" title="Drag to resize · double-click to reset"></div>
    <section id="dock">
      <div class="dock-head">
        <button id="dock-toggle" class="linkbtn" title="Show or hide the analytics (A)"><span id="dock-caret">▾</span> Analytics</button>
        <label class="chk inline"><input type="checkbox" id="cmp-map7" checked> Compare to Map 7</label>
        <span class="tb-spacer"></span>
        <button id="btn-notes" class="linkbtn">Notes</button>
      </div>
      <div id="panel-body"></div>
    </section>
  </div>

</main>

<div id="modal-back" hidden><div id="modal"></div></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
